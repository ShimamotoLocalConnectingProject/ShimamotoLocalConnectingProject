services:
  # Web Service
  - type: web
    name: shimamoto-stamp-app
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shimamoto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
    autoDeploy: true
    
databases:
  # MySQL Database
  - name: shimamoto-db
    databaseName: shimamoto_stamp
    user: shimamoto
    plan: free
    region: singapore
